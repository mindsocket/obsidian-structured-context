name: Release

# Push a version tag (created by `npm version`) to publish a GitHub release.
# Obsidian installs a plugin from the release's main.js, manifest.json and styles.css.
on:
    push:
        tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Check the tag is on main
              run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test
            - run: npm run test:smoke
            - name: Check the tag matches the manifest and versions.json
              run: |
                  test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
                  test "$(jq -r --arg v "$GITHUB_REF_NAME" '.[$v]' versions.json)" = "$(jq -r .minAppVersion manifest.json)"
            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
                      dist/main.js dist/manifest.json dist/styles.css

# Lefthook hides unstaged changes during pre-commit, so the whole-project typecheck
# sees the content being committed, not the working tree.
pre-commit:
  piped: true
  commands:
    biome:
      priority: 1
      glob: "*.{js,mjs,ts,tsx,json}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    eslint:
      priority: 2
      glob: "*.{js,mjs,ts,tsx,json}"
      run: npx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    typecheck:
      priority: 3
      glob: "*.{ts,tsx}"
      run: npm run typecheck

# Pre-push checks the commits being pushed, not the working tree. See
# check-pushed-tree.sh.
pre-push:
  commands:
    pushed-tree:
      run: bash scripts/git-hooks/check-pushed-tree.sh
